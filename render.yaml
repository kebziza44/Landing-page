# ADMIRE L.C. backend — Render.com Blueprint (FREE plan mos)
# Deploy: Render dashboard → New → Blueprint → repo tanlang.
#
# Eslatma: Free plan'da persistent disk YO'Q — shuning uchun baza
# tashqi PostgreSQL'da saqlanadi (DATABASE_URL, masalan Neon free:
# https://neon.tech). Server va'da qilingan diskka yozmaydi.
#
# DIQQAT: CMS orqali yuklangan video/rasm fayllar /tmp'da bo'lmay,
# konteyner ichida saqlanadi — restart/redeploy'da yo'qoladi
# (bazadagi yozuvlar saqlanadi). Doimiy fayllar kerak bo'lsa
# S3/Cloudflare R2 qo'shish kerak.

services:
  - type: web
    name: admire-lc-backend
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Tashqi PostgreSQL ulanish satri (Neon free tavsiya etiladi):
      # postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Quyidagilarni Render dashboardda qo'lda kiriting (secret!):
      #   TELEGRAM_BOT_TOKEN      — @BotFather tokeni
      #   TELEGRAM_BOT_USERNAME   — Admire_qabul_bot
      #   TELEGRAM_ADMIN_CHAT_ID  — 7793284016
      #   TELEGRAM_ADMIN_IDS      — 7793284016
      #   ADMIN_PASSWORD          — kuchli parol (seed admin uchun)
      #   WEBHOOK_SECRET          — ixtiyoriy uzun satr (webhook rejimi uchun)
      #   BASE_URL                — https://admire-lc-backend.onrender.com (webhook uchun)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
